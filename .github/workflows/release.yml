name: Build and publish update
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ApplyUpdate.ps1'
      - 'build.ps1'
      - 'version.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build update package
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'version.txt must have four numeric parts' }
          if ((Get-Content src\ControlConsole.cs -Raw) -notmatch ('public const string Version = "' + [regex]::Escape($version) + '"')) { throw 'BuildInfo.Version does not match version.txt' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
          Compress-Archive -Path build\ControlConsole.exe,build\Updater.exe,build\ApplyUpdate.ps1,build\version.txt -DestinationPath "ControlConsole-update-$version.zip" -CompressionLevel Optimal
          $archive = "ControlConsole-update-$version.zip"
          foreach ($case in @('install','rollback')) {
            $target = Join-Path $env:RUNNER_TEMP "nix-updater-$case-$version"
            $test = if ($case -eq 'install') { '--test-install' } else { '--test-rollback' }
            $process = Start-Process -FilePath (Resolve-Path build\Updater.exe) -ArgumentList @($test, ('"' + $target + '"'), ('"' + (Resolve-Path $archive) + '"')) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Updater $case test failed: $($process.ExitCode)" }
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $archive" -Encoding ascii
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Increase the version before publishing." }
          gh release create $tag "ControlConsole-update-$env:RELEASE_VERSION.zip" "ControlConsole-update-$env:RELEASE_VERSION.zip.sha256" --title $tag --notes 'Code update only. Install the local full package once before using automatic updates.' --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
