function dateInputValue(d){var local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
function recordBounds(now){if(recordRange==='other'){var a=document.getElementById('range-start').value,b=document.getElementById('range-end').value;if(!a||!b)return [now-7*86400000,now];var start=new Date(a+'T00:00:00').getTime(),end=new Date(b+'T00:00:00').getTime()+86400000;return [start,end]}return [now-Number(recordRange)*86400000,now]}
function drawSessions(rows){lastSessions=rows;var totals={},now=Date.now(),bounds=recordBounds(now);rows.forEach(function(s){if(!s||!s.game)return;var start=Math.max(Number(s.start)||0,bounds[0]),end=Math.min(Number(s.end)||now,bounds[1]);if(end>start)totals[s.game]=(totals[s.game]||0)+end-start});var box=document.getElementById('game-list');box.innerHTML='';Object.keys(totals).sort(function(a,b){return totals[b]-totals[a]}).forEach(function(n){var row=document.createElement('div');row.innerHTML='<span></span><b></b>';row.firstChild.textContent=n;row.lastChild.textContent=formatDuration(totals[n]);box.appendChild(row)});var total=Object.keys(totals).reduce(function(a,n){return a+totals[n]},0);document.getElementById('records-total').textContent=total?'所选时段 '+formatDuration(total)+' ♡':'所选时段没有游戏记录 ♡';if(document.getElementById('session-editor').classList.contains('show'))renderSessionEditor()}
function formatDuration(ms){var m=Math.floor(ms/60000);return Math.floor(m/60)+' 小时 '+(m%60)+' 分'}
function formatDateTime(ms){var d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function updateSession(payload){fetch('/session/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){if(!r.ok)throw Error('保存失败，请确认游戏已退出');poll()}).catch(function(e){alert(e.message)})}
function renderSessionEditor(){var box=document.getElementById('session-entries');box.innerHTML='';lastSessions.slice(0,50).forEach(function(s){var row=document.createElement('div');row.className='entry';var title=document.createElement('div');title.textContent=s.game+' · '+formatDateTime(s.start)+' → '+(s.end?formatDateTime(s.end):'运行中');row.appendChild(title);if(s.end&&s.id){[['改游戏',function(){var name=prompt('正确的游戏名称',s.game);if(name&&name.trim())updateSession({id:s.id,game:name.trim(),end:s.end})}],['改结束时间',function(){var value=prompt('结束时间，格式 YYYY-MM-DD HH:MM',formatDateTime(s.end));if(!value)return;var end=new Date(value.trim().replace(' ','T')).getTime();if(!Number.isFinite(end)||end<s.start){alert('结束时间无效');return}updateSession({id:s.id,game:s.game,end:end})}],['删除',function(){if(confirm('确定删除这条游戏记录？'))updateSession({id:s.id,delete:true})}]].forEach(function(action){var button=document.createElement('button');button.textContent=action[0];button.onclick=action[1];row.appendChild(button)})}box.appendChild(row)})}
setInterval(poll,1000);poll();
for(const w of document.querySelectorAll('.window')){const h=w.querySelector('.title');h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;w.style.zIndex=++z;const s=Math.min(innerWidth/1920,innerHeight/1080),r=stage.getBoundingClientRect(),ox=(e.clientX-r.left)/s-w.offsetLeft,oy=(e.clientY-r.top)/s-w.offsetTop;h.setPointerCapture(e.pointerId);const move=a=>{w.style.left=Math.max(0,Math.min(1920-w.offsetWidth,(a.clientX-r.left)/s-ox))+'px';w.style.top=Math.max(0,Math.min(1040-w.offsetHeight,(a.clientY-r.top)/s-oy))+'px'};h.addEventListener('pointermove',move);h.addEventListener('pointerup',()=>h.removeEventListener('pointermove',move),{once:true})})}
document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{recordRange=b.dataset.days;document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('date-range').classList.toggle('show',recordRange==='other');drawSessions(lastSessions)});['range-start','range-end'].forEach(id=>document.getElementById(id).onchange=()=>drawSessions(lastSessions));document.getElementById('range-start').value=dateInputValue(new Date(Date.now()-7*86400000));document.getElementById('range-end').value=dateInputValue(new Date());document.getElementById('manage-sessions').onclick=()=>{document.getElementById('session-editor').classList.add('show');renderSessionEditor()};document.getElementById('close-editor').onclick=()=>document.getElementById('session-editor').classList.remove('show');
</script></body></html>
